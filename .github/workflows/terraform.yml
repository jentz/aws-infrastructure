name: Terraform

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Plan for PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event_name == 'push'
      && format('Apply on main: {0}', github.event.head_commit.message)
      || format('Manual plan on {0}', github.ref_name) }}

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.14.9"
  AWS_REGION: "eu-west-1"

jobs:
  plan:
    name: Plan ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, cognito-sandbox, common, jentz.co]
    defaults:
      run:
        working-directory: terraform/${{ matrix.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::567516037984:role/github-actions-plan-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false -lock=false

      - name: Terraform plan
        run: terraform plan -input=false -lock=false -no-color -out=plan.out

      - name: Render plan to text
        run: terraform show -no-color plan.out > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ matrix.dir }}
          path: |
            terraform/${{ matrix.dir }}/plan.out
            terraform/${{ matrix.dir }}/plan.txt
          retention-days: 5

  summary:
    name: Plan summary
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Download plan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plan-*
          path: plans

      - name: Write run summary and sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- terraform-plan -->';
            // GitHub caps issue comments at 65535 chars; reserve headroom.
            const PER_DIR_CAP = 12000;
            const TOTAL_CAP = 60000;

            const dirs = fs.readdirSync('plans')
              .filter(d => d.startsWith('plan-'))
              .sort();

            const renderSection = (projectDir, text) =>
              `<details><summary>terraform/${projectDir}</summary>\n\n\`\`\`hcl\n${text}\n\`\`\`\n\n</details>`;

            const sections = dirs.map(d => {
              const projectDir = d.replace(/^plan-/, '');
              const planPath = path.join('plans', d, 'plan.txt');
              const text = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : '(plan.txt missing)';
              const capped = text.length > PER_DIR_CAP
                ? text.slice(0, PER_DIR_CAP) + '\n\n... (truncated; see Actions log for full plan)'
                : text;
              return {
                full: renderSection(projectDir, text),
                capped: renderSection(projectDir, capped),
              };
            });

            const header = `${marker}\n## Terraform plan\n\n`;

            await core.summary.addRaw(header + sections.map(s => s.full).join('\n')).write();

            if (context.eventName !== 'pull_request') return;

            const truncationNotice = '\n\n_(truncated; see Actions run for details)_';
            const cappedBody = header + sections.map(s => s.capped).join('\n');
            let comment = cappedBody;
            if (cappedBody.length > TOTAL_CAP) {
              const accepted = [];
              let used = header.length + truncationNotice.length;
              for (const s of sections) {
                const cost = (accepted.length ? 1 : 0) + s.capped.length;
                if (used + cost > TOTAL_CAP) break;
                used += cost;
                accepted.push(s.capped);
              }
              comment = header + accepted.join('\n') + truncationNotice;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  apply:
    name: Apply
    if: github.event_name == 'push'
    needs: [plan, summary]
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download plan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plan-*
          path: plans

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::567516037984:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply each plan
        run: |
          set -euo pipefail
          for d in plans/plan-*; do
            dir="${d#plans/plan-}"
            echo "::group::Applying terraform/$dir"
            cp "$d/plan.out" "terraform/$dir/plan.out"
            terraform -chdir="terraform/$dir" init -input=false
            terraform -chdir="terraform/$dir" apply -input=false plan.out
            echo "::endgroup::"
          done
